  ubuntu@ip-172-31-37-193:~/team12-chatbot-api$ cat docker-compose.yaml
  services:
    postgres:
      image: ankane/pgvector
      container_name: bossbot-postgres-prod
      platform: linux/amd64
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      volumes:
        - postgres_data:/var/lib/postgresql/data
      restart: unless-stopped
      networks:
        - internal

    ollama:
      image: ollama/ollama
      container_name: bossbot-ollama-prod
      ports:
        - "11434:11434"
      volumes:
        - ollama_data:/root/.ollama
      healthcheck:
        test: ["CMD", "ollama", "list"]
        interval: 5s
        timeout: 5s
        retries: 10
      restart: unless-stopped
      networks:
        - internal

    ollama-init:
      image: ollama/ollama
      container_name: bossbot-ollama-init-prod
      depends_on:
        ollama:
          condition: service_healthy
      restart: "no"
      entrypoint:
        ["sh", "-c", "ollama pull nomic-embed-text && ollama pull llama3.2:3b"]
      environment:
        - OLLAMA_HOST=ollama:11434
      networks:
        - internal

    backend:
      build:
        context: ./bossbot
        dockerfile: Dockerfile
      container_name: bossbot-backend-prod
      environment:
        SPRING_PROFILES_ACTIVE: production
        DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
        DATABASE_USERNAME: ${POSTGRES_USER}
        DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
        JWT_SECRET: ${JWT_SECRET}
        JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
        APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
        APP_FRONTEND_URL: ${APP_FRONTEND_URL}
        OPENAI_API_KEY: ${OPENAI_API_KEY}
        OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
        OLLAMA_URL: http://ollama:11434
      ports:
        - "8080:8080"
      env_file:
        - .env.production
      depends_on:
        postgres:
          condition: service_started
        ollama-init:
          condition: service_completed_successfully
      restart: unless-stopped
      networks:
        - internal
        - web

    prometheus:
      image: prom/prometheus:v2.51.1
      container_name: bossbot-prometheus-prod
      command:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--storage.tsdb.retention.time=30d"
      volumes:
        - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus_data:/prometheus
      restart: unless-stopped
      networks:
        - internal

    grafana:
      image: grafana/grafana:10.4.1
      container_name: bossbot-grafana-prod
      environment:
        - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
        - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
        - GF_USERS_ALLOW_SIGN_UP=false
        - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
        - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN}
        - GF_AUTH_ANONYMOUS_ENABLED=false
      volumes:
        - grafana_data:/var/lib/grafana
        - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      ports:
        - "3000:3000"
      depends_on:
        - prometheus
      restart: unless-stopped
      networks:
        - internal
        - web

  networks:
    internal:
      driver: bridge
    web:
      driver: bridge

  volumes:
    postgres_data:
    ollama_data:
    prometheus_data:
    grafana_data:
