# Production profile - for deploying to production server
# Use this profile whether deploying:
#  - As a JAR directly on server
#  - In a Docker container to production
# Set SPRING_PROFILES_ACTIVE=production when deploying

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA Configuration for production
spring.jpa.hibernate.ddl-auto=validate
# No SQL logging (performance)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Connection pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Liquibase in production
spring.liquibase.enabled=true
# Only run migrations without context or with 'production' context (excludes test data)
spring.liquibase.contexts=production

# Disable API docs in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.example.bossbot=INFO
logging.level.liquibase=INFO

# Security - ENFORCE authentication in production
app.security.permit-all=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration.milliseconds=${JWT_EXPIRATION_MS:900000}

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.frontend.url=${APP_FRONTEND_URL}

# Actuator and Metrics - Secure Configuration for Production
management.server.port=8080
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=never  # Hide internal details
management.endpoint.env.show-values=NEVER
management.endpoint.configprops.show-values=NEVER
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=bossbot
management.metrics.tags.environment=production
management.metrics.enable.hikaricp=true
management.metrics.enable.jvm=true
management.metrics.enable.logback=true
management.metrics.enable.system=true
